pluginManagement {
    def flutterSdkPath = {
        def props = new Properties()
        def localPropertiesFile = new File(rootProject.projectDir, "local.properties")
        if (localPropertiesFile.exists()) {
            props.load(localPropertiesFile.newDataInputStream())
        }
        def flutterSdk = props.getProperty("flutter.sdk")
        if (flutterSdk == null) {
            flutterSdk = System.getenv("FLUTTER_ROOT")
        }
        if (flutterSdk == null) {
            throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in local.properties or FLUTTER_ROOT env.")
        }
        return flutterSdk
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.2.0" apply false
    id "org.jetbrains.kotlin.android" version "1.9.22" apply false
}

include ":app"
